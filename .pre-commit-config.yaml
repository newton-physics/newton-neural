ci:
  autofix_commit_msg: |
    [pre-commit.ci] auto code formatting
  autofix_prs: false
  autoupdate_branch: ""
  autoupdate_commit_msg: "[pre-commit.ci] pre-commit autoupdate"
  autoupdate_schedule: quarterly
  # pre-commit.ci has no network access, but uv-lock needs to resolve
  # dependencies from remote indexes (PyPI, nvidia, pytorch).
  skip:
    - uv-lock
  submodules: false

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-case-conflict
      - id: check-illegal-windows-names
      - id: check-json
      - id: check-merge-conflict
      - id: check-symlinks
      - id: check-toml
      - id: check-yaml
      - id: debug-statements
      - id: detect-private-key
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/astral-sh/uv-pre-commit
    rev: 0.13.5
    hooks:
      - id: uv-lock
  - repo: https://github.com/crate-ci/typos
    rev: v1.51.1
    hooks:
      - id: typos
        args: []
        exclude: \.(js|css|svg)$
  - repo: local
    hooks:
      - id: check-warp-array-syntax
        name: check warp array syntax
        entry: python scripts/check_warp_array_syntax.py
        language: python
        types: [python]
        exclude: ^(scripts/check_warp_array_syntax\.py)
      - id: import-layers
        name: check the import layers of newton_neural
        entry: uv run --group dev lint-imports
        language: system
        pass_filenames: false
        files: ^newton_neural/.*\.py$
